name: Deploy Z.E.R.O. to GitHub Pages

# Manual-only: kept private for now. Trigger from the Actions tab
# ("Run workflow") when you're ready to make the dashboard public.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zero-brain
      - id: deployment
        uses: actions/deploy-pages@v4
